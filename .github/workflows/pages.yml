name: Publish storefront to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build
        env:
          PAGES_PREVIEW: "1"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify published stylesheets
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const base = new URL(process.env.PAGES_URL);
          base.pathname = base.pathname.replace(/\/?$/, "/");

          async function verify(route) {
            const page = new URL(route, base);
            const response = await fetch(page, { signal: AbortSignal.timeout(10000) });
            if (!response.ok) throw new Error(`${page}: HTTP ${response.status}`);
            const html = await response.text();
            const styles = [...html.matchAll(/<link\b[^>]*>/g)]
              .map(([tag]) => /\brel="stylesheet"/.test(tag) && tag.match(/\bhref="([^"]+)"/)?.[1])
              .filter(Boolean);
            if (!styles.length) throw new Error(`${page}: no stylesheet links`);

            await Promise.all(styles.map(async style => {
              const url = new URL(style, response.url);
              if (!url.pathname.startsWith(base.pathname + "_next/")) {
                throw new Error(`${page}: stylesheet uses the wrong base path: ${url.pathname}`);
              }
              const css = await fetch(url, { signal: AbortSignal.timeout(10000) });
              if (!css.ok || !css.headers.get("content-type")?.includes("text/css")) {
                throw new Error(`${url}: expected CSS, got HTTP ${css.status} (${css.headers.get("content-type")})`);
              }
              await css.body?.cancel();
            }));
            console.log(`${page}: ${styles.length} stylesheet(s) loaded`);
          }

          for (let attempt = 1; ; attempt++) {
            try {
              await Promise.all(["", "shop/", "studio/orange/"].map(verify));
              break;
            } catch (error) {
              if (attempt === 12) throw error;
              console.log(`Waiting for Pages: ${error.message}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          const lowercasePath = base.pathname.toLowerCase();
          if (lowercasePath !== base.pathname) {
            try {
              await verify(lowercasePath);
              console.log(`::notice::The lowercase Pages address works: ${new URL(lowercasePath, base)}`);
            } catch (error) {
              console.log(`::warning::The lowercase Pages address could not be verified: ${error.message}`);
            }
          }
          JS
